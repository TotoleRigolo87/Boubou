<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💘</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
      overflow:hidden;
    }
    .card{
      width:min(560px, 92vw);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 22px;
      padding: 26px 22px;
      text-align:center;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }
    h1{ margin:0 0 10px; font-size: clamp(26px, 4.5vw, 38px); }
    p{ margin:0 0 16px; opacity:.85; }

    .arena{
      position: relative;
      height: 150px;
      margin-top: 10px;
    }

    button{
      border:0; border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      user-select:none;
      touch-action: manipulation;
      position: relative;
      z-index: 2;
    }
    #yes{ background:#ff3b6b; color:white; }
    #yes:hover{ transform: translateY(-2px) scale(1.02); }

    /* Bouton NON: position fixed pour pouvoir fuir partout */
    #no{
      background: white;
      color:#333;
      position: fixed;
      left: 60vw;
      top: 55vh;
      z-index: 3;
      will-change: transform;
    }

    #result{
      margin-top: 14px;
      font-size: 20px;
      font-weight: 700;
      color:#ff2e63;
      min-height: 28px;
    }

    .photoWrap{
      margin-top: 14px;
      display:none;
      justify-content:center;
    }
    .photo{
      width:min(380px, 82vw);
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
    }

    .heart{
      position: fixed;
      font-size: 22px;
      pointer-events:none;
      animation: floatUp 1.2s ease forwards;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.15));
      z-index: 4;
    }
    @keyframes floatUp{
      0%{ transform: translateY(0) scale(.9); opacity:0; }
      15%{ opacity:1; }
      100%{ transform: translateY(-140px) scale(1.25); opacity:0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Veux-tu être ma Valentine ? 💘</h1>
    <p>Promis, une réponse est plus facile que l’autre 😅</p>

    <div class="arena">
      <button id="yes">Oui 😍</button>
      <button id="no">Non 🙃</button>
    </div>

    <div id="result"></div>

    <div class="photoWrap" id="photoWrap">
      <!-- Upload une image dans le repo : photo.jpg (ou change le nom ici) -->
      <img class="photo" id="photo" src="photo.jpg" alt="Nous ❤️"
           onerror="this.style.display='none'; document.getElementById('result').textContent += ' (Ajoute une image nommée photo.jpg dans le repo)';" />
    </div>
  </div>

  <script>
    // ===== Réglages fuite =====
    const RADIUS   = 160;   // rayon autour de la souris où le bouton vise (px)
    const MIN_DIST = 130;   // distance minimale bouton-souris (px) -> empêche qu'il arrive sur la souris
    const SPEED    = 0.28;  // vitesse de glissement (0.18 lent -> 0.35 très rapide)
    const JITTER   = 0.45;  // aléa directionnel pour éviter les alignements
    const DODGE_ON_HOVER_BOOST = 220; // boost quand la souris le touche presque

    const noBtn  = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const result = document.getElementById("result");
    const photoWrap = document.getElementById("photoWrap");

    // Position bouton (coordonnées écran)
    let pos = { x: window.innerWidth * 0.65, y: window.innerHeight * 0.55 };
    let target = { ...pos };
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    // Rend le bouton visible + place initialement
    noBtn.style.display = "inline-block";
    noBtn.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%)`;

    function setTargetAwayFromMouse(extraPush = 0) {
      // vecteur souris -> bouton (direction de fuite)
      let dx = pos.x - mouse.x;
      let dy = pos.y - mouse.y;

      let len = Math.hypot(dx, dy);
      if (!len || len < 1) {
        const a = Math.random() * Math.PI * 2;
        dx = Math.cos(a);
        dy = Math.sin(a);
        len = 1;
      }

      // direction normalisée
      let ux = dx / len;
      let uy = dy / len;

      // jitter (petite rotation aléatoire)
      const angle = (Math.random() - 0.5) * 2 * JITTER;
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const rux = ux * cosA - uy * sinA;
      const ruy = ux * sinA + uy * cosA;

      // distance désirée: au moins MIN_DIST, et en général autour de RADIUS
      const desired = Math.max(RADIUS, MIN_DIST + 40) + extraPush;

      target.x = mouse.x + rux * desired;
      target.y = mouse.y + ruy * desired;
      // On autorise la sortie d’écran => pas de clamp.
    }

    function tick() {
      // garde-fou: si trop proche, on recalcul une cible immédiatement
      const d = Math.hypot(pos.x - mouse.x, pos.y - mouse.y);
      if (d < MIN_DIST) setTargetAwayFromMouse(80);

      // interpolation fluide vers target
      pos.x += (target.x - pos.x) * SPEED;
      pos.y += (target.y - pos.y) * SPEED;

      noBtn.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%)`;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Suivi souris
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      setTargetAwayFromMouse();
    });

    // Mobile: suivi doigt
    window.addEventListener("touchmove", (e) => {
      if (!e.touches || !e.touches[0]) return;
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      setTargetAwayFromMouse();
    }, { passive: true });

    // Quand on arrive vraiment dessus, gros boost (donne l'impression "il va plus vite")
    noBtn.addEventListener("mouseenter", () => setTargetAwayFromMouse(DODGE_ON_HOVER_BOOST));

    // Empêche un tap de valider "Non" sur mobile
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      setTargetAwayFromMouse(DODGE_ON_HOVER_BOOST);
    }, { passive:false });

    // Clic oui
    yesBtn.addEventListener("click", () => {
      result.textContent = "Yesss 😭❤️ Bonne Saint-Valentin mon amour !";
      photoWrap.style.display = "flex";
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.textContent = "💞💞💞";
      for (let i=0; i<26; i++) spawnHeart();
    });

    function spawnHeart(){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = ["❤️","💖","💘","💕","💗"][Math.floor(Math.random()*5)];
      const x = Math.random() * window.innerWidth;
      const y = window.innerHeight - 40 - Math.random()*140;
      h.style.left = x + "px";
      h.style.top  = y + "px";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    // initialisation de la cible
    setTargetAwayFromMouse();
  </script>
</body>
</html>
