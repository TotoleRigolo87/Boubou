<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boubou 💘</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, Arial, sans-serif;
  background: linear-gradient(135deg,#ffdde1,#ee9ca7);
  overflow:hidden;
}

.card{
  background:white;
  padding:28px;
  border-radius:20px;
  width:min(520px,92vw);
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  z-index:1;
}

.arena{
  height:160px;
  margin-top:20px;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:999px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,.15);
}

#yes{
  background:#ff3b6b;
  color:white;
}

#no{
  background:#f2f2f2;
  position:fixed;
  left:50vw;
  top:55vh;
  transform:translate(-50%,-50%);
  z-index:9999;
  will-change:left, top, transform;
}

#result{
  margin-top:16px;
  font-size:20px;
  font-weight:700;
  color:#ff2e63;
}

.photoWrap{
  display:none;
  margin-top:14px;
}

.photoWrap img{
  width:min(360px,80vw);
  border-radius:18px;
  box-shadow:0 16px 40px rgba(0,0,0,.25);
}

/* Tremblement */
.shake{
  animation: shake 0.12s infinite;
}
@keyframes shake{
  0%{ transform:translate(-50%,-50%) translate(0,0); }
  25%{ transform:translate(-50%,-50%) translate(-2px,1px); }
  50%{ transform:translate(-50%,-50%) translate(2px,-1px); }
  75%{ transform:translate(-50%,-50%) translate(-1px,2px); }
}
</style>
</head>

<body>
<div class="card">
  <h1>Boubou veux-tu être ma valentine ? 💘</h1>
  <p>Une réponse est un peu plus compliquée que l’autre 😅</p>

  <div class="arena">
    <button id="yes">Oui 😍</button>
  </div>

  <div id="result"></div>

  <div class="photoWrap" id="photoWrap">
    <img src="photo.jpg" alt="Nous ❤️">
  </div>
</div>

<button id="no">Non 🙃</button>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const result = document.getElementById("result");
const photoWrap = document.getElementById("photoWrap");

const MIN_DIST = 150;
const DASH_DIST = 80;
let baseSpeed = 12;
let speed = baseSpeed;
let moves = 0;

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function dodge(mx, my){
  const b = noBtn.getBoundingClientRect();
  const bx = b.left + b.width/2;
  const by = b.top + b.height/2;

  const dx = bx - mx;
  const dy = by - my;
  const dist = Math.hypot(dx, dy);

  if (dist > MIN_DIST) {
    noBtn.classList.remove("shake");
    return;
  }

  // panique = tremblement
  noBtn.classList.add("shake");

  moves++;
  speed = baseSpeed + Math.min(28, moves * 0.7);

  let angle = Math.atan2(dy, dx);

  // DASH brutal si trop proche
  if (dist < DASH_DIST) {
    speed *= 2.8;
    angle += (Math.random() - 0.5) * 1.2;
  } else {
    angle += (Math.random() - 0.5) * 0.5;
  }

  const nx = bx + Math.cos(angle) * speed;
  const ny = by + Math.sin(angle) * speed;

  const m = 6;
  noBtn.style.left =
    clamp(nx, m + b.width/2, window.innerWidth - m - b.width/2) + "px";
  noBtn.style.top =
    clamp(ny, m + b.height/2, window.innerHeight - m - b.height/2) + "px";
}

// Souris
window.addEventListener("mousemove", e => dodge(e.clientX, e.clientY));

// Mobile
window.addEventListener("touchmove", e => {
  if (!e.touches[0]) return;
  dodge(e.touches[0].clientX, e.touches[0].clientY);
}, { passive:true });

noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.touches[0];
  if (t) dodge(t.clientX, t.clientY);
}, { passive:false });

noBtn.addEventListener("click", e => e.preventDefault());

// OUI
yesBtn.addEventListener("click", () => {
  result.textContent = "Yesss 😭❤️ Bonne Saint-Valentin !";
  photoWrap.style.display = "block";
  noBtn.style.display = "none";
  yesBtn.disabled = true;
  yesBtn.textContent = "💞💞💞";
});
</script>
</body>
</html>
