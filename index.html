<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valentine 💘</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, Arial, sans-serif;
  background: linear-gradient(135deg,#ffdde1,#ee9ca7);
}

.card{
  background:white;
  padding:28px;
  border-radius:20px;
  width:min(520px,92vw);
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h1{ margin-top:0 }

.arena{
  position:relative;
  height:160px;
  margin-top:20px;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:999px;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,.15);
}

#yes{
  background:#ff3b6b;
  color:white;
}

#no{
  background:#f2f2f2;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#result{
  margin-top:16px;
  font-size:20px;
  font-weight:700;
  color:#ff2e63;
}

.photoWrap{
  display:none;
  margin-top:14px;
}

.photoWrap img{
  width:min(360px,80vw);
  border-radius:18px;
  box-shadow:0 16px 40px rgba(0,0,0,.25);
}
</style>
</head>

<body>
<div class="card">
  <h1>Boubou veux-tu être ma valentine ? 💘</h1>
  <p>Un conseil ne te trompe pas !💕 </p>

  <div class="arena" id="arena">
    <button id="yes">Oui 😍</button>
    <button id="no">Non 🙃</button>
  </div>

  <div id="result"></div>

  <div class="photoWrap" id="photoWrap">
    <img src="photo.jpg" alt="Nous ❤️">
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const arena = document.getElementById("arena");
const result = document.getElementById("result");
const photoWrap = document.getElementById("photoWrap");

const MIN_DIST = 120; // distance minimale souris/bouton
const SPEED = 18;     // vitesse de fuite (px)

arena.addEventListener("mousemove", (e) => {
  const arenaRect = arena.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const mouseX = e.clientX - arenaRect.left;
  const mouseY = e.clientY - arenaRect.top;

  const btnX = btnRect.left - arenaRect.left + btnRect.width/2;
  const btnY = btnRect.top - arenaRect.top + btnRect.height/2;

  const dx = btnX - mouseX;
  const dy = btnY - mouseY;
  const dist = Math.hypot(dx, dy);

  if (dist < MIN_DIST) {
    const angle = Math.atan2(dy, dx);
    const newX = btnX + Math.cos(angle) * SPEED;
    const newY = btnY + Math.sin(angle) * SPEED;

    noBtn.style.left = `${Math.max(0, Math.min(arenaRect.width, newX))}px`;
    noBtn.style.top  = `${Math.max(0, Math.min(arenaRect.height, newY))}px`;
    noBtn.style.transform = "translate(-50%,-50%)";
  }
});

noBtn.addEventListener("click", e => e.preventDefault());

yesBtn.addEventListener("click", () => {
  result.textContent = "Yesss 😭❤️ Bonne Saint-Valentin !";
  photoWrap.style.display = "block";
  noBtn.style.display = "none";
  yesBtn.disabled = true;
  yesBtn.textContent = "💞💞💞";
});
</script>
</body>
</html>
